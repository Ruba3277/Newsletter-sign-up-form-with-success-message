<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"rel="stylesheet">
  <title>Frontend Mentor | Newsletter sign-up form with success message</title>
  <link rel="stylesheet" href="thankyou.css">
</head>
<body>
    <header></header>
    <main>
        <section class="thank-you">
            <img src="assets/images/icon-success.svg" alt="success">
            <div class="success-msg">
                <h1>Thanks for subscribing!</h1>
                <p>A confirmation email has been sent to <strong id="user-email"></strong>. Please open it and click the button inside to confirm your subscription.</p>
            </div>
            
        </section>
        <button type="button" id="dismiss-btn" class="dismiss-btn">Dismiss message</button>
    </main>
    <footer></footer>
    <script> 
    const params = new URLSearchParams(window.location.search);
    const email=params.get("email");
    document.querySelector("#user-email").textContent = email;
    const dismissBtn = document.querySelector("#dismiss-btn");
    dismissBtn.addEventListener("click", () => {
        window.location.href = "index.html";
    });
    </script>
</body>
